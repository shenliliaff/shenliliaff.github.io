<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>读书笔记 | fengsKB</title>
    <link rel="icon" href="reading-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css" />
    <link rel="stylesheet" href="https://unpkg.com/@waline/client@3/dist/waline.css" />
    <style>
      .sidebar .app-name img {
        display: inline-block;
        width: 28px;
        height: 28px;
        margin-right: 8px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="app">加载中...</div>
    <script>
      window.$docsify = {
        name: '<img src="reading-icon.svg" alt="" aria-hidden="true" /> fengsKB 读书笔记',
        repo: "https://github.com/shenliliaff/shenliliaff.github.io",
        homepage: "README.md",
        loadNavbar: true,
        loadSidebar: true,
        subMaxLevel: 3,
        search: {
          maxAge: 86400000,
          paths: [
            "README.md",
            "2026-10-21-scent-of-a-woman-and-intouchables.md",
            "2026-09-10-south-sudan-civil-war.md",
            "2026-09-09-animal-farm-george-orwell.md",
            "2026-09-03-the-year-of-1587.md",
            "2026-09-02-the-world-i-see-fei-fei-li.md",
          ],
          depth: 3,
          placeholder: "搜索读书笔记",
          noData: "没有找到匹配的笔记",
        },
        plugins: [
          function (hook) {
            hook.beforeEach(function (content) {
              return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n*/, "");
            });
          },
          // 每篇读书笔记底部注入 Waline 评论区
          function (hook) {
            hook.doneEach(function () {
              var main = document.querySelector("main .content, section.content");
              if (!main) return;
              // 首页（README）不渲染评论
              var file = location.hash.replace(/^#\/?/, "") || "README.md";
              if (/README\.md$/i.test(file)) return;
              // 避免重复注入
              var existing = document.getElementById("waline-wrap");
              if (existing) { existing.remove(); }
              var wrap = document.createElement("div");
              wrap.id = "waline-wrap";
              wrap.style.marginTop = "32px";
              wrap.innerHTML =
                '<div style="font-weight:600;margin-bottom:12px;">评论</div>' +
                '<div id="waline"></div>';
              main.appendChild(wrap);
              if (window.Waline) {
                window.Waline.init({
                  el: "#waline",
                  serverURL: "https://waline.vttjit.tech",
                  path: "/reading" + location.hash.replace(/^#/, ""),
                  login: "enable",
                  meta: ["nick", "mail", "link"],
                  requiredMeta: ["nick"],
                  dark: false,
                  pageSize: 10,
                  lang: "zh-CN",
                });
              }
            });
          },
        ],
      };

      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
          const searchInput = document.querySelector(".search input");

          if (searchInput instanceof HTMLInputElement) {
            event.preventDefault();
            searchInput.focus();
          }
        }
      });
    </script>
    <script src="https://unpkg.com/docsify@4"></script>
    <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://unpkg.com/@waline/client@3/dist/waline.js"></script>
  </body>
</html>
