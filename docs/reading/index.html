<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>读书笔记 | fengsKB</title>
    <link rel="icon" href="reading-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css" />
    <style>
      .sidebar .app-name img {
        display: inline-block;
        width: 28px;
        height: 28px;
        margin-right: 8px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="app">加载中...</div>
    <script>
      window.$docsify = {
        name: '<img src="reading-icon.svg" alt="" aria-hidden="true" /> fengsKB 读书笔记',
        repo: "https://github.com/shenliliaff/shenliliaff.github.io",
        homepage: "README.md",
        loadNavbar: true,
        loadSidebar: true,
        subMaxLevel: 3,
        search: {
          maxAge: 86400000,
          paths: [
            "/reading/README.md",
            "/reading/2026-09-10-south-sudan-civil-war.md",
            "/reading/2026-09-09-animal-farm-george-orwell.md",
            "/reading/2026-09-03-the-year-of-1587.md",
            "/reading/2026-09-02-the-world-i-see-fei-fei-li.md",
          ],
          depth: 3,
          placeholder: "搜索读书笔记",
          noData: "没有找到匹配的笔记",
        },
        plugins: [
          function (hook) {
            hook.beforeEach(function (content) {
              return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n*/, "");
            });
          },
          // 每篇读书笔记底部注入 Giscus 评论区
          function (hook) {
            hook.doneEach(function () {
              var main = document.querySelector("main .content, section.content");
              if (!main) return;
              // 首页（README）不渲染评论
              var file = location.hash.replace(/^#\/?/, "") || "README.md";
              if (/README\.md$/i.test(file)) return;
              // 避免重复注入
              var existing = document.getElementById("giscus-comment");
              if (existing) { existing.remove(); }
              var wrap = document.createElement("div");
              wrap.id = "giscus-wrap";
              wrap.style.marginTop = "32px";
              wrap.innerHTML =
                '<div style="font-weight:600;margin-bottom:12px;">评论</div>' +
                '<div id="giscus-comment"></div>';
              main.appendChild(wrap);
              // 页面路径作为 giscus 的 discussion 映射键（/reading 前缀 + 文件名去 .md）
              var pagePath = "/reading/" + (location.hash.replace(/^#\/?/, "") || "README.md").replace(/\.md$/i, "");
              var script = document.createElement("script");
              script.src = "https://giscus.app/client.js";
              script.setAttribute("data-repo", "shenliliaff/shenliliaff.github.io");
              script.setAttribute("data-repo-id", "R_kgDOOQgGPg");
              script.setAttribute("data-category", "Announcements");
              script.setAttribute("data-category-id", "DIC_kwDOOQgGPs4DI9Fo");
              script.setAttribute("data-mapping", "specific");
              script.setAttribute("data-term", pagePath);
              script.setAttribute("data-strict", "0");
              script.setAttribute("data-reactions-enabled", "1");
              script.setAttribute("data-emit-metadata", "0");
              script.setAttribute("data-input-position", "bottom");
              script.setAttribute("data-theme", "light");
              script.setAttribute("data-lang", "zh-CN");
              script.setAttribute("crossorigin", "anonymous");
              script.async = true;
              document.getElementById("giscus-comment").appendChild(script);
            });
          },
        ],
      };

      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
          const searchInput = document.querySelector(".search input");

          if (searchInput instanceof HTMLInputElement) {
            event.preventDefault();
            searchInput.focus();
          }
        }
      });
    </script>
    <script src="https://unpkg.com/docsify@4"></script>
    <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
